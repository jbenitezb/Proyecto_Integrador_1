<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Sistema de Desarrollo Curricular y Docente</title>
    <link rel="stylesheet" href="../estilos/estilos.css">
    <link rel="stylesheet" href="../estilos/iniciar_session.css">
    <link href='https://cdn.boxicons.com/fonts/basic/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <header class="header">
        <nav class="menu">
            <div class="logo">
                <img src="../img/images-removebg-preview.png" alt="Logo" class="imagen">
                <span class="logo_texto"></span>
            </div>
        </nav>
    </header>

    <main id="login">
        <div class="login_contenedor">
            <div class="panel">
                <h1 class="panel_titulo">INICIAR SESIÓN</h1>
                <form class="login_formulario" id="formulario">
                    <div class="campo">
                        <label class="etiqueta" for="correo">CORREO ELECTRÓNICO</label>
                        <input type="text" class="entrada" id="correo" placeholder="CORREO ELECTRÓNICO" maxlength="100" autocomplete="username">
                    </div>

                    <div class="campo">
                        <label class="etiqueta" for="contrasena">CONTRASEÑA</label>
                        <input type="password" class="entrada" id="contrasena" placeholder="CONTRASEÑA" maxlength="50" autocomplete="current-password">
                    </div>

                    <p class="error" id="error_formulario"></p>

                    <div class="acciones_formulario">
                        <button type="submit" class="btn_enviar" id="btn_ingresar">INGRESAR</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer_referencia">

        <div class="footer_columna">
            <p><strong>WhatsApp General: </strong></p>
            <p>+506 6000 8050</p>
            <p><strong>Correo electrónico: </strong></p>
            <p>info@ucenfotec.ac.cr</p>
            <p><strong>Dirección:</strong></p>
            <p>
                Barrio Francisco Peralta, sobre Avenida Central y Calle 33, 
                10104 San José, Provincia de San José, Costa Rica.
            </p>
        </div>

        <div class="footer_columna">
            <h3>REDES SOCIALES</h3>
            <div class="footer_redes">
                <div class="footer_redes">
                    <a href="https://www.facebook.com/UCenfotec">f</a>
                    <a href="https://x.com/ucenfotec">𝕏</a>
                    <a href="https://www.youtube.com/@UniversidadCenfotec/videos">▶</a>
                    <a href="https://www.instagram.com/ucenfotec">回</a>
                    <a href="https://www.linkedin.com/school/universidad-cenfotec/">in</a>
                </div>
            </div>
        </div>
    </footer>

     <script src="..//Js/iniciar_session.js"></script>
</body>
</html>
